<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="สมาชิกพรรคสัจจะ">
<title>สมาชิกพรรค | พรรคสัจจะ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Prompt:wght@400;500;600;700;800&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js');</script>
<style>
  :root{
    color-scheme:light;
    --red:#D7192D;--red-deep:#A10E1F;
    --grad:linear-gradient(135deg,#F2384B 0%,#C8102E 100%);
    --ink:#1A1213;--muted:#776A6C;--line:#F3DCDF;--tint:#FFF3F4;
    --radius:24px;--ease:cubic-bezier(.2,.7,.2,1);
    --display:"Unbounded","Prompt",system-ui,sans-serif;
    --body:"Archivo","Prompt",system-ui,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:96px}
  body{font-family:var(--body);background:#fff;color:var(--ink);line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  ul,ol{list-style:none}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  :focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:6px}
  ::selection{background:var(--red);color:#fff}
  [hidden]{display:none !important}
  h1,h2,h3{font-family:var(--display);line-height:1.25}
  p{margin:0}
  .wrap{width:min(1120px,90%);margin-inline:auto}

  /* ---------- scroll progress ---------- */
  .progress{position:fixed;top:0;left:0;right:0;height:4px;background:var(--grad);transform:scaleX(0);transform-origin:0 50%;z-index:100}

  /* ---------- floating pill navbar ---------- */
  .topbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(94%,1100px);padding:8px 8px 8px 20px;border-radius:999px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);border:1px solid var(--line);z-index:50;transition:background .3s,box-shadow .3s}
  .topbar.scrolled{background:rgba(255,255,255,.94);box-shadow:0 12px 40px -18px rgba(26,18,19,.25)}
  .topbar .wrap{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:900;letter-spacing:.02em}
  .logo{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(215,25,45,.2)}50%{box-shadow:0 0 0 9px rgba(215,25,45,.04)}}
  .nav-links{display:flex;gap:4px}
  .nav-links a{display:block;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);transition:background .25s,color .25s}
  .nav-links a:hover{background:var(--tint);color:var(--red-deep)}

  /* three-line button: turns into an X when open */
  .menu-btn{display:none;position:relative;width:44px;height:44px;margin-left:auto;border-radius:50%;background:var(--tint);transition:transform .2s var(--ease)}
  .menu-btn:active{transform:scale(.9)}
  .menu-btn span{position:absolute;left:13px;right:13px;height:2px;border-radius:2px;background:var(--ink);transition:transform .3s var(--ease),opacity .2s,top .3s var(--ease)}
  .menu-btn span:nth-child(1){top:15px}
  .menu-btn span:nth-child(2){top:21px}
  .menu-btn span:nth-child(3){top:27px}
  .menu-btn.is-open span:nth-child(1){top:21px;transform:rotate(45deg)}
  .menu-btn.is-open span:nth-child(2){opacity:0}
  .menu-btn.is-open span:nth-child(3){top:21px;transform:rotate(-45deg)}

  /* ---------- page background ---------- */
  .page{position:relative;isolation:isolate;overflow:hidden;padding:170px 0 120px;background:#fff}
  .page::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 60% 0%,#000 15%,transparent 70%);mask-image:radial-gradient(ellipse at 60% 0%,#000 15%,transparent 70%)}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;z-index:-1;pointer-events:none;animation:float 14s ease-in-out infinite}
  .b1{width:420px;height:420px;background:var(--red);top:-160px;right:-120px}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.08)}}

  /* ---------- list header ---------- */
  .page-title{font-size:clamp(2.6rem,8vw,5.6rem);font-weight:900;letter-spacing:-.01em;color:var(--red-deep)}
  .title-line{display:block;width:72px;height:4px;margin-top:22px;border-radius:4px;background:var(--grad);transform-origin:left}
  .page-sub{margin-top:18px;color:var(--muted)}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:16px 30px;border:2px solid var(--red);border-radius:999px;background:#fff;color:var(--red-deep);font-weight:700;font-size:16px;box-shadow:0 14px 30px -14px rgba(200,16,46,.6);transition:transform .25s var(--ease),background .25s,box-shadow .25s}
  .btn:hover{transform:translateY(-3px);background:var(--tint);box-shadow:0 20px 40px -14px rgba(200,16,46,.7)}
  .btn:active{transform:scale(.98)}
  .btn-line{border-color:var(--ink);color:var(--ink);box-shadow:none}
  .btn-line:hover{background:var(--tint);box-shadow:none}

  /* ---------- cards ---------- */
  .card{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#fff;transition:transform .4s var(--ease),box-shadow .4s,border-color .4s}
  .card:hover{transform:translateY(-6px);border-color:rgba(215,25,45,.4);box-shadow:0 26px 50px -28px rgba(200,16,46,.55)}
  .card>*{position:relative;z-index:1}
  .card::after{content:"";position:absolute;inset:0;z-index:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(215,25,45,.1),transparent 70%)}
  .card:hover::after{opacity:1}

  /* member list cards */
  .member-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:56px}
  .member-card{padding:26px 28px}
  .member-card::before{content:"";position:absolute;left:0;top:22px;bottom:22px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
  .member-card h3{font-size:1.15rem;font-weight:700;margin-bottom:8px;padding-right:60px}
  .member-card .role{color:var(--red-deep);font-weight:700;font-size:.95rem}
  .member-link{display:inline-block;margin-top:14px;color:var(--muted);font-weight:500;transition:color .25s}
  .member-link:hover{color:var(--red-deep);text-decoration:underline;text-underline-offset:4px}

  /* number badge, colored by tone */
  .member-num{position:absolute;top:22px;right:22px;display:grid;place-items:center;min-width:44px;height:44px;padding:0 10px;border-radius:14px;background:var(--badge-bg);color:var(--badge-ink);font-family:var(--display);font-size:14px;font-weight:700;box-shadow:0 10px 20px -12px rgba(200,16,46,.6)}

  /* four tones, repeated down the list: 1, 2, 3, 4, 1, 2, ... */
  .tone-0{--accent:#D7192D;--badge-bg:var(--tint);--badge-ink:var(--red-deep)}
  .tone-1{--accent:#A10E1F;--badge-bg:var(--grad);--badge-ink:#fff}
  .tone-2{--accent:#F2384B;--badge-bg:#FFD6DB;--badge-ink:var(--red-deep)}
  .tone-3{--accent:#1A1213;--badge-bg:var(--ink);--badge-ink:#fff}

  /* ---------- detail view ---------- */
  .detail-head{display:flex;align-items:center;gap:36px;flex-wrap:wrap}
  .detail-head>div{flex:1 1 320px;min-width:0}
  .avatar-xl{display:grid;place-items:center;flex-shrink:0;width:160px;height:160px;border-radius:44px;background:var(--grad);color:#fff;font-family:var(--display);font-size:56px;font-weight:900;box-shadow:0 30px 60px -24px rgba(200,16,46,.7)}
  .detail-name{font-size:clamp(2rem,5vw,3.2rem);font-weight:900;letter-spacing:-.01em;color:var(--ink)}
  .role-pill{display:inline-block;margin-top:16px;padding:6px 16px;border-radius:999px;background:var(--tint);color:var(--red-deep);font-weight:700;font-size:.95rem}
  .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
  .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:32px;font-size:14px;color:var(--muted)}
  .crumbs a{transition:color .25s}
  .crumbs a:hover{color:var(--red-deep)}

  .info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:56px}
  .info{padding:24px}
  .info dt{margin-bottom:6px;font-size:.85rem;color:var(--muted)}
  .info dd{font-size:1.05rem;font-weight:700;word-break:break-word}

  .bio{max-width:760px;margin-top:48px;color:var(--muted);font-size:1.05rem}

  .contact{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;max-width:760px;margin-top:48px;padding:32px}
  .contact-label{font-size:.85rem;color:var(--muted)}
  .contact-value{font-family:var(--display);font-size:1.1rem;font-weight:700;word-break:break-all}
  .contact-actions{display:flex;flex-wrap:wrap;gap:12px}
  .copy-msg{width:100%;min-height:1.4em;font-size:.95rem;font-weight:600;color:var(--red-deep)}

  /* ---------- back to top ---------- */
  .to-top{position:fixed;right:20px;bottom:20px;z-index:40;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--grad);color:#fff;font-size:22px;font-weight:700;box-shadow:0 18px 36px -14px rgba(200,16,46,.7);opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .3s,transform .3s var(--ease)}
  .to-top.show{opacity:1;transform:none;pointer-events:auto}

  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);padding:56px 0 64px}
  footer p{color:var(--muted)}

  /* ---------- motion ---------- */
  @keyframes heroRise{from{opacity:0;translate:0 28px;filter:blur(6px)}to{opacity:1;translate:0 0;filter:blur(0)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .js .page-title{animation:heroRise 1s var(--ease) both}
  .js .title-line{animation:grow .9s var(--ease) .3s both}
  .js .page-sub{animation:heroRise 1s var(--ease) .15s both}
  .js .detail-head,.js .crumbs{animation:heroRise 1s var(--ease) both}
  .js .reveal{opacity:0;translate:0 32px}
  .js .reveal.in{opacity:1;translate:0 0;transition:opacity .9s var(--ease) var(--d,0s),translate .9s var(--ease) var(--d,0s),transform .4s var(--ease),box-shadow .4s,border-color .4s}

  /* ---------- responsive ---------- */
  @media (max-width:1040px){
    .member-grid,.info-grid{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:760px){
    .topbar{top:10px}
    .menu-btn{display:block}
    .nav-links{display:flex;flex-direction:column;gap:2px;position:absolute;top:calc(100% + 10px);left:0;right:0;padding:12px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 50px -20px rgba(215,25,45,.35);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-12px) scale(.98);transform-origin:top right;transition:opacity .35s var(--ease),transform .35s var(--ease),visibility .35s}
    .nav-links.open{opacity:1;visibility:visible;pointer-events:auto;transform:none}
    .nav-links a{padding:14px 16px;opacity:0;transform:translateX(-10px);transition:opacity .3s,transform .3s,background .25s,color .25s}
    .nav-links.open a{opacity:1;transform:none}
    .nav-links.open li:nth-child(1) a{transition-delay:.06s}
    .nav-links.open li:nth-child(2) a{transition-delay:.12s}
    .page{padding-top:130px}
    .info-grid{grid-template-columns:1fr}
    .avatar-xl{width:124px;height:124px;font-size:44px;border-radius:36px}
    .contact{padding:26px}
  }
  @media (max-width:480px){
    .member-grid{grid-template-columns:1fr}
  }

  /* ---------- reduced motion ---------- */
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation:none !important;transition:none !important}
    .js .reveal{opacity:1;translate:none}
  }
</style>
</head>
<body>
<div class="progress" aria-hidden="true"></div>

<header class="topbar" id="topbar">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="logo" aria-hidden="true"></span>พรรคสัจจะ</a>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="เปิดเมนู" aria-expanded="false" aria-controls="navLinks">
      <span></span><span></span><span></span>
    </button>
    <nav>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">หน้าหลัก</a></li>
        <li><a href="#members">สมาชิก</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <!-- list of all members -->
  <div class="page" id="listView">
    <div class="blob b1" aria-hidden="true"></div>
    <div class="wrap">
      <h1 class="page-title">สมาชิกพรรค</h1>
      <span class="title-line" aria-hidden="true"></span>
      <p class="page-sub">สมาชิกทั้งหมด <span id="count"></span> คน</p>
      <div class="member-grid" id="memberGrid"></div>
    </div>
  </div>

  <!-- one member's details (shown when ดูข้อมูล is clicked) -->
  <div class="page" id="detailView" hidden>
    <div class="blob b1" aria-hidden="true"></div>
    <div class="wrap" id="detail"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <p>© <span id="year"></span> พรรคสัจจะนภา</p>
  </div>
</footer>

<button class="to-top" id="toTop" type="button" aria-label="กลับขึ้นด้านบน">↑</button>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LIST_TITLE = 'สมาชิกพรรค | พรรคสัจจะ';

  /* ============ MEMBER DATA: edit here ============
     Each { ... } is one member. Change any field.
     Any field you leave out uses the default below.
     education = ชั้น / ห้องเรียน (shown on the detail page) */
  const defaults = {
    nick: 'ใส่ชื่อเล่น',
    joined: '00 / 00 / 0000',
    education: 'ใส่ชั้น / ห้องเรียน'
  };

  const members = [
    {

    {

    },
    {

      role: 'สมาชิกพรรค',

    },
    {

      role: 'สมาชิกพรรค',

    {

    {

    },
    {

      role: 'สมาชิกพรรค',

    },
    {

      role: 'สมาชิกพรรค',
      nick: '-',

    },
    {

    },
    {

      role: 'สมาชิกพรรค',

    },
    {

    },

      education: 'มัธยมศึกษาปีที่ ',
    },
    {
      name: 'ชื่อ-นามสกุล 16',
      role: 'สมาชิกพรรค',
      nick: '-',
      education: 'มัธยมศึกษาปีที่ ',
    },
    {
      name: 'ชื่อ-นามสกุล 17',
      role: 'สมาชิกพรรค',
      nick: '-',
      education: 'มัธยมศึกษาปีที่ ',
    },
    {
      name: 'ชื่อ-นามสกุล 18',
      role: 'สมาชิกพรรค',
      nick: '-',
      education: 'ม.6',
    },
    {
      name: 'ชื่อ-นามสกุล 19',
      role: 'สมาชิกพรรค',
      nick: '-',
      education: 'มัธยมศึกษาปีที่ ',
    },
    {
      name: 'ชื่อ-นามสกุล 20',
      role: 'สมาชิกพรรค',
      nick: 'ก้อง',
      education: 'มัธยมศึกษาปีที่ ',
    },
    {
      name: 'ชื่อ-นามสกุล 21',
      role: 'สมาชิกพรรค',
      nick: 'มายด์',
      education: 'มัธยมศึกษาปีที่ ',
    },
  ].map((m, i) => ({ ...defaults, ...m, id: i + 1 }));

  /* ---------- elements ---------- */
  const listView = $('#listView');
  const detailView = $('#detailView');
  const grid = $('#memberGrid');
  const detail = $('#detail');
  const topbar = $('#topbar');
  const menuBtn = $('#menuBtn');
  const navLinks = $('#navLinks');
  const toTop = $('#toTop');
  const progress = $('.progress');

  /* ---------- mobile menu ---------- */
  const isMenuOpen = () => navLinks.classList.contains('open');

  function setMenu(open) {
    navLinks.classList.toggle('open', open);
    menuBtn.classList.toggle('is-open', open);
    menuBtn.setAttribute('aria-expanded', String(open));
    menuBtn.setAttribute('aria-label', open ? 'ปิดเมนู' : 'เปิดเมนู');
  }

  menuBtn.addEventListener('click', () => setMenu(!isMenuOpen()));
  $$('a', navLinks).forEach(a => a.addEventListener('click', () => setMenu(false)));
  document.addEventListener('click', e => {
    if (isMenuOpen() && !topbar.contains(e.target)) setMenu(false);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
  matchMedia('(min-width: 761px)').addEventListener('change', e => { if (e.matches) setMenu(false); });

  /* ---------- navbar shadow, progress bar, back to top ---------- */
  function onScroll() {
    topbar.classList.toggle('scrolled', scrollY > 40);
    toTop.classList.toggle('show', scrollY > 500);
    const max = document.documentElement.scrollHeight - innerHeight;
    progress.style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`;
  }
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', onScroll);
  toTop.addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));
  onScroll();

  /* ---------- glow that follows the cursor (mouse only) ---------- */
  if (matchMedia('(hover: hover)').matches && !reduceMotion) {
    addEventListener('pointermove', e => {
      const card = e.target.closest?.('.card');
      if (!card) return;
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', `${e.clientX - r.left}px`);
      card.style.setProperty('--my', `${e.clientY - r.top}px`);
    }, { passive: true });
  }

  /* ---------- reveal on scroll (siblings stagger) ---------- */
  function revealIn(root) {
    const els = $$('.reveal', root);
    if (reduceMotion || !('IntersectionObserver' in window)) {
      els.forEach(el => el.classList.add('in'));
      return;
    }
    const io = new IntersectionObserver((entries, obs) => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          en.target.classList.add('in');
          obs.unobserve(en.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    els.forEach((el, i) => {
      el.style.setProperty('--d', `${(i % 3) * 0.1}s`);
      io.observe(el);
    });
  }

  /* ---------- HTML builders ---------- */
  function cardHTML(m) {
    const tone = `tone-${(m.id - 1) % 4}`;
    return `
      <article class="card member-card ${tone} reveal">
        <span class="member-num">${String(m.id).padStart(2, '0')}</span>
        <h3>${m.name}</h3>
        <p class="role">${m.role}</p>
        <a class="member-link" href="#member-${m.id}">ดูข้อมูล</a>
      </article>`;
  }

  function detailHTML(m) {
    const info = [
      ['ชื่อเล่น', m.nick],
      ['ชั้น / ห้องเรียน', m.education],
    ];
    return `
      <nav class="crumbs" aria-label="เส้นทาง">
        <a href="#members">สมาชิกพรรค</a>
        <span aria-hidden="true">/</span>
        <span>${m.name}</span>
      </nav>

      <div class="detail-head">
        <span class="avatar-xl" aria-hidden="true">${String(m.id).padStart(2, '0')}</span>
        <div>
          <h1 class="detail-name">${m.name}</h1>
          <span class="role-pill">${m.role}</span>
          <div class="actions">
            <a class="btn btn-line" href="#members">← กลับไปหน้าสมาชิก</a>
          </div>
        </div>
      </div>

      <dl class="info-grid">
        ${info.map(([label, value]) => `
        <div class="card info reveal"><dt>${label}</dt><dd>${value}</dd></div>`).join('')}
      </dl>`;
  }

  /* ---------- views ---------- */
  function showList() {
    detailView.hidden = true;
    listView.hidden = false;
    document.title = LIST_TITLE;
  }

  function showDetail(m) {
    listView.hidden = true;
    detailView.hidden = false;
    detail.innerHTML = detailHTML(m);
    document.title = `${m.name} | พรรคสัจจะ`;
    revealIn(detail);
  }

  /* #member-1, #member-2, ... show details; anything else shows the list */
  function route() {
    const match = location.hash.match(/^#member-(\d+)$/);
    const m = match ? members.find(x => x.id === Number(match[1])) : null;
    if (m) showDetail(m); else showList();
    scrollTo(0, 0);
  }

  /* ---------- build the list ---------- */
  grid.innerHTML = members.map(cardHTML).join('');
  $('#count').textContent = members.length;
  revealIn(grid);

  addEventListener('hashchange', route);
  route();

  /* ---------- footer year ---------- */
  $('#year').textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
